<div class="row">
  <div class="col-4">
    <ul>
      @for (item of rolesList; track $index) {
        <li>{{ item.role }}</li>
      }
    </ul>
  </div>

  <div class="col-4">
    <select>
      @for (role of rolesList; track role.roleid) {
        <option [value]="role.roleid">
          {{ role.role }}
        </option>
      }
    </select>
  </div>
</div>
